<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Codex Thunderbird Plugin</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-64.png" alt="">
        <div>
          <h1>Codex Thunderbird Plugin</h1>
          <p id="status">Not paired</p>
        </div>
      </header>

      <section class="steps">
        <ol>
          <li>In Codex, call <code>start_pairing</code>.</li>
          <li>Paste the bridge URL and six-digit PIN below.</li>
          <li>Click Pair, then check <code>get_status</code>.</li>
        </ol>
      </section>

      <form id="pairForm">
        <label>
          <span>Bridge URL</span>
          <input id="bridgeUrl" value="http://127.0.0.1:17654" spellcheck="false" autocomplete="off">
        </label>
        <label>
          <span>Pairing PIN</span>
          <input id="pin" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
        </label>
        <div class="actions">
          <button id="pair" type="submit">Pair</button>
          <button id="disconnect" type="button">Disconnect</button>
        </div>
      </form>

      <dl>
        <div>
          <dt>Local only</dt>
          <dd>Only localhost bridge URLs are accepted.</dd>
        </div>
        <div>
          <dt>Access</dt>
          <dd>Codex can read and organize mail after pairing.</dd>
        </div>
      </dl>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
